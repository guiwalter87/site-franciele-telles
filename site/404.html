<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Franciele Telles</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--blue:#3E93D1;--indigo:#6277BD;--violet:#9A7BB6;--ink:#1B2038;--ink-2:#4B5273;--paper:#FCFCFE}
  *{box-sizing:border-box;margin:0}
  body{
    background:var(--paper);color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-weight:300;
    min-height:100svh;display:grid;place-items:center;padding:40px 20px;text-align:center;
  }
  .mesh{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(60vw 50vw at 12% 0%,rgba(62,147,209,.16),transparent 62%),
               radial-gradient(56vw 48vw at 92% 14%,rgba(154,123,182,.16),transparent 64%)}
  img{width:74px;margin:0 auto 28px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:clamp(2rem,5vw,3.2rem);
     line-height:1.1;letter-spacing:-.02em;margin-bottom:16px;text-wrap:balance}
  .grad{background:linear-gradient(115deg,var(--blue),var(--indigo) 48%,var(--violet));
        -webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
  p{color:var(--ink-2);max-width:46ch;margin:0 auto 32px;line-height:1.6}
  .acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a.btn{display:inline-flex;align-items:center;padding:14px 26px;border-radius:999px;
        text-decoration:none;font-size:.95rem;color:#fff;
        background:linear-gradient(115deg,var(--blue),var(--indigo) 48%,var(--violet))}
  a.ghost{background:none;color:var(--ink);border:1px solid rgba(98,119,189,.28)}
</style>
</head>
<body>
<div class="mesh"></div>
<main>
  <img src="img/logo-mark.png" alt="Franciele Telles">
  <h1>Essa página <span class="grad">não existe mais</span></h1>
  <p>Pode ser que o endereço tenha mudado de lugar. Volte para o início ou me chame no WhatsApp que eu te ajudo a encontrar o que procura.</p>
  <div class="acts">
    <a class="btn" href="/">Voltar para o início</a>
    <a class="btn ghost" href="https://wa.me/5551991299114?text=Ol%C3%A1!%20Vim%20pelo%20site%20e%20gostaria%20de%20agendar%20um%20hor%C3%A1rio." target="_blank" rel="noopener">Falar no WhatsApp</a>
  </div>
</main>
</body>
</html>
